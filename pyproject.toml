[project]
name = "ymu"
version = "1.1.10"
description = "The smart launcher for YimMenu: Always updated, always ready."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "packaging>=26.3",
    "psutil>=7.2.2",
    "pyinjector>=1.3.0",
    "pyside6>=6.11.2",
    "pywin32>=312",
    "requests>=2.34.2",
]

[dependency-groups]
dev = ["nuitka>=4.2", "ruff>=0.16.5"]
