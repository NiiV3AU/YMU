# This workflow will install Python dependencies, build an executable,
# generate a checksum, and then create a new GitHub Release with the artifacts.
#
# The version is the single source of truth in src/paths.py (LOCAL_VERSION).
# It drives the built exe's metadata, the release tag and the release name, and
# it is also what the app compares against when checking for updates — so bump
# LOCAL_VERSION before running this workflow.

name: YMU Manual Release

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    name: Build YMU on Windows
    outputs:
      full_sha: ${{ steps.var.outputs.full_sha }}
      version: ${{ steps.meta.outputs.version }}
      year: ${{ steps.meta.outputs.year }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync

      - name: Lint with Ruff
        run: uv run ruff check src

      - name: Get build metadata
        id: meta
        run: |
          $content = Get-Content src/paths.py -Raw
          if ($content -match 'LOCAL_VERSION\s*=\s*"v?([0-9]+\.[0-9]+\.[0-9]+)"') {
            $version = $Matches[1]
          } else {
            Write-Error "Could not find LOCAL_VERSION in src/paths.py"
            exit 1
          }
          $year = (Get-Date).Year
          echo "version=$version" >> $env:GITHUB_OUTPUT
          echo "year=$year" >> $env:GITHUB_OUTPUT
          Write-Host "Building YMU version $version ($year)"

      - name: Build Executable
        run: |
          uv run python -m nuitka --onefile --standalone --enable-plugin=pyside6 --windows-icon-from-ico=src/assets/icons/ymu.ico --include-data-dir=src/assets=assets --windows-console-mode=disable --assume-yes-for-downloads --output-dir=dist --company-name="YMU" --product-name="YMU" --file-version="${{ steps.meta.outputs.version }}" --product-version="${{ steps.meta.outputs.version }}" --file-description="YimMenuUpdater" --copyright="github.com/NiiV3AU/YMU - ${{ steps.meta.outputs.year }}" --output-filename=YMU.exe --lto=yes src/gui.py

      - name: Generate Checksum for Executable
        run: |
          # Use the native Windows command to generate the SHA256 checksum
          certutil -hashfile dist\YMU.exe SHA256 > dist\YMU.exe.sha256
          # Optional: Display the checksum in the logs
          cat dist\YMU.exe.sha256

      - name: Generate Build Info
        id: var
        run: |
          echo "full_sha=$(git rev-parse HEAD)" >> $env:GITHUB_OUTPUT
          echo "short_sha=$(git rev-parse --short HEAD)" >> $env:GITHUB_OUTPUT

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ymu-build-artifacts
          path: |
            dist/YMU.exe
            dist/YMU.exe.sha256

  publish_release:
    runs-on: ubuntu-latest
    name: Create GitHub Release
    needs: build
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          name: ymu-build-artifacts

      - name: Resolve version tag
        id: version
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          echo "new_version=v${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Release version: v${VERSION}"

      - name: Ensure tag does not already exist
        uses: actions/github-script@v7
        with:
          script: |
            const tag = "${{ steps.version.outputs.new_version }}";
            const { owner, repo } = context.repo;
            try {
              await github.rest.git.getRef({ owner, repo, ref: `tags/${tag}` });
              core.setFailed(`Tag ${tag} already exists. Bump LOCAL_VERSION in src/paths.py before releasing.`);
            } catch (error) {
              if (error.status === 404) {
                console.log(`Tag ${tag} is free. Proceeding.`);
              } else {
                throw error;
              }
            }

      - name: Read Checksum File
        id: read_sha
        run: |
          # Read the checksum content and remove extra lines/text from certutil's output
          sha_content=$(grep -v "SHA256" YMU.exe.sha256 | grep -v "CertUtil")
          echo "build_sha=${sha_content}" >> $GITHUB_OUTPUT
          echo "Checksum content: ${sha_content}"

      - name: Create and Upload Release
        uses: softprops/action-gh-release@v2
        with:
          name: YMU ${{ steps.version.outputs.new_version }}
          tag_name: ${{ steps.version.outputs.new_version }}
          body: |
            ### Changelog:
            * ...

            ---
            ### SHA256 Checksum:
            `${{ steps.read_sha.outputs.build_sha }}`

            ---
            >[!NOTE]
            >**This release was built by Github Actions**
            >| [Link to build](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) |
            >| --- |
          files: |
            YMU.exe
            YMU.exe.sha256
