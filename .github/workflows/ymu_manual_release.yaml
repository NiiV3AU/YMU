# This workflow will install Python dependencies, build an executable,
# generate a checksum, and then create a new GitHub Release with the artifacts.
#
# The version is the single source of truth in src/core/paths.py (LOCAL_VERSION).
# It drives the built exe's metadata, the release tag and the release name, and
# it is also what the app compares against when checking for updates — so bump
# LOCAL_VERSION before running this workflow.

name: YMU Manual Release

on:
  workflow_dispatch:

concurrency:
  group: ymu-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    name: Build YMU on Windows
    timeout-minutes: 90
    outputs:
      full_sha: ${{ steps.var.outputs.full_sha }}
      version: ${{ steps.meta.outputs.version }}
      year: ${{ steps.meta.outputs.year }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --locked

      - name: Lint with Ruff
        run: uv run ruff check src

      - name: Type check with ty
        run: uv run ty check src

      - name: Type check with pyrefly
        run: uv run pyrefly check

      - name: Verify Version Sync
        run: |
          $pyproject = Get-Content pyproject.toml -Raw
          if ($pyproject -match 'version\s*=\s*"([^"]+)"') {
            $pyprojectVersion = $Matches[1]
          } else {
            Write-Error "Could not find version in pyproject.toml"
            exit 1
          }
          $pathsContent = Get-Content src/core/paths.py -Raw
          if ($pathsContent -match 'LOCAL_VERSION\s*=\s*"v?([^"]+)"') {
            $pathsVersion = $Matches[1]
          } else {
            Write-Error "Could not find LOCAL_VERSION in src/core/paths.py"
            exit 1
          }
          if ($pyprojectVersion -ne $pathsVersion) {
            Write-Error "Version mismatch: pyproject.toml ($pyprojectVersion) != src/core/paths.py ($pathsVersion)"
            exit 1
          }
          $changelog = Get-Content CHANGELOG.md -Raw
          if ($changelog -notmatch "##\s+\[v?$pathsVersion\]") {
            Write-Error "CHANGELOG.md does not have section for version $pathsVersion"
            exit 1
          }
          Write-Host "[OK] Versions match across pyproject.toml, paths.py, and CHANGELOG.md: $pathsVersion"

      - name: Get build metadata
        id: meta
        run: |
          $content = Get-Content src/core/paths.py -Raw
          if ($content -match 'LOCAL_VERSION\s*=\s*"v?([0-9]+\.[0-9]+\.[0-9]+)"') {
            $version = $Matches[1]
          } else {
            Write-Error "Could not find LOCAL_VERSION in src/core/paths.py"
            exit 1
          }
          $year = (Get-Date).Year
          echo "version=$version" >> $env:GITHUB_OUTPUT
          echo "year=$year" >> $env:GITHUB_OUTPUT
          Write-Host "Building YMU version $version ($year)"

      - name: Build Executable
        run: |
          uv run python -m nuitka --onefile --onefile-tempdir-spec="{CACHE_DIR}/{COMPANY}/{PRODUCT}/{VERSION}" --enable-plugin=pyside6 --noinclude-qt-translations --noinclude-qt-plugins=tls --noinclude-dlls=*pdf* --noinclude-dlls=*Qt6Network* --noinclude-dlls=*direct2d* --noinclude-dlls=*jpeg* --noinclude-dlls=*webp* --noinclude-dlls=*tiff* --noinclude-dlls=*icns* --noinclude-dlls=*tga* --noinclude-dlls=*offscreen* --noinclude-dlls=*minimal* --noinclude-dlls=*qgif* --noinclude-dlls=*qwbmp* --nofollow-import-to=PySide6.QtNetwork --noinclude-unittest-mode=nofollow --noinclude-pydoc-mode=nofollow --noinclude-pytest-mode=nofollow --noinclude-setuptools-mode=nofollow --standalone --windows-icon-from-ico=src/assets/icons/ymu.ico --include-data-dir=src/assets=assets --include-data-dir=src/ui/styles=ui/styles --windows-console-mode=disable --assume-yes-for-downloads --output-dir=dist --company-name="YMU" --product-name="YMU" --file-version="${{ steps.meta.outputs.version }}" --product-version="${{ steps.meta.outputs.version }}" --file-description="YimMenuUpdater" --copyright="github.com/NiiV3AU/YMU - ${{ steps.meta.outputs.year }}" --output-filename=YMU.exe --lto=yes src/main.py 2>&1 | Tee-Object -FilePath nuitka_build.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify DLL Exclusions
        run: |
          $expectedExclusions = @(
            'qt6pdf.dll',
            'qt6network.dll',
            'qdirect2d.dll',
            'qjpeg.dll',
            'qwebp.dll',
            'qtiff.dll',
            'qicns.dll',
            'qtga.dll',
            'qpdf.dll',
            'qoffscreen.dll',
            'qminimal.dll',
            'qgif.dll',
            'qwbmp.dll'
          )
          if (Test-Path nuitka_build.log) {
            $logContent = Get-Content nuitka_build.log -Raw
            $warnings = [regex]::Matches($logContent, "missing expected file '([^']+)'") | ForEach-Object { Split-Path $_.Groups[1].Value -Leaf }
            $missing = @($expectedExclusions | Where-Object { $warnings -notcontains $_ })
            if ($missing.Count -eq 0) {
              Write-Host "::notice title=Nuitka Pruned DLLs::All $($expectedExclusions.Count) expected DLL exclusions verified in Onefile build."
              Write-Host "[OK] All $($expectedExclusions.Count) pruned DLL exclusions confirmed: $($expectedExclusions -join ', ')"
            } else {
              Write-Host "::warning title=Nuitka Pruned DLLs::DLL exclusion verification incomplete ($($expectedExclusions.Count - $missing.Count)/$($expectedExclusions.Count) verified). Missing in warnings: $($missing -join ', ')"
            }
          } else {
            Write-Host "::warning title=Nuitka Pruned DLLs::nuitka_build.log not found, DLL exclusion check skipped."
          }

      - name: Generate Checksum for Executable
        run: |
          # Use the native Windows command to generate the SHA256 checksum
          certutil -hashfile dist\YMU.exe SHA256 > dist\YMU.exe.sha256
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # Optional: Display the checksum in the logs
          cat dist\YMU.exe.sha256

      - name: Generate Build Info
        id: var
        run: |
          echo "full_sha=$(git rev-parse HEAD)" >> $env:GITHUB_OUTPUT
          echo "short_sha=$(git rev-parse --short HEAD)" >> $env:GITHUB_OUTPUT

      - name: Upload Artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ymu-build-artifacts
          path: |
            dist/YMU.exe
            dist/YMU.exe.sha256

  publish_release:
    runs-on: ubuntu-latest
    name: Create GitHub Release
    timeout-minutes: 60
    needs: build
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download Artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ymu-build-artifacts

      - name: Resolve version tag
        id: version
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          echo "new_version=v${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Release version: v${VERSION}"

      - name: Ensure tag does not already exist
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const tag = "${{ steps.version.outputs.new_version }}";
            const { owner, repo } = context.repo;
            try {
              await github.rest.git.getRef({ owner, repo, ref: `tags/${tag}` });
              core.setFailed(`Tag ${tag} already exists. Bump LOCAL_VERSION in src/core/paths.py before releasing.`);
            } catch (error) {
              if (error.status === 404) {
                console.log(`Tag ${tag} is free. Proceeding.`);
              } else {
                throw error;
              }
            }

      - name: Read Checksum File
        id: read_sha
        run: |
          # Extract exactly 64-hex characters from certutil output in a locale-agnostic way
          sha_content=$(grep -oiE '[0-9a-f]{64}' YMU.exe.sha256 | head -1)
          if [[ ! "$sha_content" =~ ^[0-9a-fA-F]{64}$ ]]; then
            echo "Error: Invalid or empty SHA256 checksum extracted: '$sha_content'"
            exit 1
          fi
          echo "build_sha=${sha_content}" >> $GITHUB_OUTPUT
          echo "Checksum content: ${sha_content}"

      - name: Extract Release Notes from CHANGELOG.md
        id: changelog
        env:
          TAG: ${{ steps.version.outputs.new_version }}
        run: |
          python3 - << 'EOF'
          import re, os

          tag = os.environ.get("TAG", "")
          changelog_file = "CHANGELOG.md"
          notes = ""

          if os.path.exists(changelog_file) and tag:
              with open(changelog_file, "r", encoding="utf-8") as f:
                  content = f.read()
              clean_tag = tag.removeprefix("v")
              pattern = rf"(##\s+\[v?{re.escape(clean_tag)}\][\s\S]*?)(?=\n##\s+\[|\Z)"
              match = re.search(pattern, content)
              if match:
                  notes = match.group(1).strip()

          if not notes:
              raise RuntimeError(f"Release notes for {tag} not found in {changelog_file}")

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              delimiter = "CHANGELOG_DELIMITER"
              out.write(f"notes<<{delimiter}\n{notes}\n{delimiter}\n")
          EOF

      - name: Create and Upload Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          name: YMU ${{ steps.version.outputs.new_version }}
          tag_name: ${{ steps.version.outputs.new_version }}
          body: |
            ${{ steps.changelog.outputs.notes }}

            ---
            ### SHA256 Checksum:
            `${{ steps.read_sha.outputs.build_sha }}`

            ---
            >[!NOTE]
            >**This release was built by Github Actions**
            >| [Link to build](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) |
            >| --- |
          files: |
            YMU.exe
            YMU.exe.sha256
            THIRD-PARTY-NOTICES.md
